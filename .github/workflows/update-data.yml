name: Weekly Data Update

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas openpyxl

      - name: Rebuild database with fresh Yahoo Finance data
        run: |
          rm -f financial_metrics.db
          python populate_real_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add financial_metrics.db financial_metrics_real.xlsx
          if git diff --cached --quiet; then
            echo "No data changes this week."
          else
            git commit -m "Weekly data update: $(date -u +%Y-%m-%d)"
            git push
          fi
