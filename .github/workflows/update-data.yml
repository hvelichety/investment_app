name: Weekly Data Update

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas openpyxl libsql

      - name: Rebuild database with fresh Yahoo Finance data
        run: |
          rm -f data/financial_metrics.db
          python scripts/populate_real_data.py
          # Segment overlays are loaded inside populate_real_data.py from
          # data/segment_metrics.json (keeps SPCX Connectivity/Space/AI after rebuild).

      - name: Sync cloud database (Turso)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scripts/migrate_to_cloud.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/financial_metrics.db data/financial_metrics_real.xlsx
          if git diff --cached --quiet; then
            echo "No data changes this week."
          else
            git commit -m "Weekly data update: $(date -u +%Y-%m-%d)"
            git push
          fi
