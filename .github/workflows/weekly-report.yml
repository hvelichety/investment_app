name: Weekly Report

# Scheduled (Friday night, after the close): fact packs only, committed to
# data/factpacks/, plus the scorecard in data/metrics/. No API key is used.
# The pre-post gate (src/analysis/gate.py) checks each pack as it is built;
# stale packs are rebuilt up to 3 times, and again Saturday morning. The commentary, fact check and review
# issues are then written from the Claude project on Saturday (the user chose
# this on 2026-11-04 to avoid API costs).
#
# Run manually with mode "full" for the old fully automated report: analyst
# memo, commentary and fact check through the Anthropic API (uses credits),
# opened as one issue per ticker. Nothing is posted to Slack.
on:
  schedule:
    # Fridays 23:17 UTC, after the 22:30 data update
    - cron: '17 23 * * 5'
    # Saturdays 07:23 UTC: rebuild any pack that is still stale, before the
    # 4:41 AM New York report run (09:41 UTC in winter, 08:41 in summer)
    - cron: '23 7 * * 6'
  workflow_dispatch:
    inputs:
      tickers:
        description: Space-separated tickers (blank = every ticker with a playbook)
        required: false
        default: ''
      mode:
        description: factpacks (no API cost) or full (uses Anthropic API credits)
        required: false
        default: factpacks

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic pyyaml pandas yfinance

      - name: Check data and run tests
        run: python tests/test_analysis.py

      - name: Write fact packs (rebuilt until fresh)
        id: packs
        if: github.event_name == 'schedule' || inputs.mode != 'full'
        env:
          TICKERS: ${{ inputs.tickers }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          tickers="$TICKERS"
          if [ "$SCHEDULE" = "23 7 * * 6" ]; then
            # Saturday morning safety net: rebuild only packs that are stale or missing
            tickers=$(python scripts/gate.py packs --stale-only $TICKERS || true)
            if [ -z "$tickers" ]; then
              echo "All fact packs are fresh; nothing to rebuild."
              exit 0
            fi
            echo "Rebuilding stale packs: $tickers"
          fi
          # The pre-post gate runs inside the build: lines that fail a sanity
          # check are removed from the pack and the fix is recorded.
          for attempt in 1 2 3; do
            python scripts/run_weekly.py --factpacks-only $tickers || true
            stale=$(python scripts/gate.py packs --stale-only $tickers || true)
            if [ -z "$stale" ]; then
              echo "Fact packs fresh after attempt $attempt."
              break
            fi
            echo "Still stale after attempt $attempt: $stale"
            tickers="$stale"
            if [ "$attempt" -lt 3 ]; then sleep 600; fi
          done
          if [ -n "$stale" ]; then
            echo "::warning::Fact packs still stale after 3 attempts: $stale. Those tickers' Saturday posts will be held."
          fi
          python scripts/gate.py packs || true

      - name: Scorecard
        if: github.event_name == 'schedule' || inputs.mode != 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state all --search "Weekly report in:title" --limit 40 \
            --json title,body,createdAt,url > "$RUNNER_TEMP/issues.json" || echo "[]" > "$RUNNER_TEMP/issues.json"
          python scripts/scorecard.py --issues "$RUNNER_TEMP/issues.json"

      - name: Commit fact packs and metrics
        if: github.event_name == 'schedule' || inputs.mode != 'full'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/factpacks/ data/metrics/
          if git diff --cached --quiet; then
            echo "Fact packs and metrics unchanged."
          else
            git commit -m "Fact packs and scorecard: week ending $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Write reports
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}   # optional: enables the method review
          TICKERS: ${{ inputs.tickers }}
        run: python scripts/run_weekly.py $TICKERS

      - name: Keep reports
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-reports
          path: reports/
          if-no-files-found: ignore

      - name: Open review issues
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for body in reports/*_weekly.md; do
            ticker=$(basename "$body" _weekly.md)
            gh issue create \
              --title "Weekly report for review: $ticker ($(date -u +%Y-%m-%d))" \
              --body-file "$body"
          done

      - name: Propose method changes
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- playbooks/; then
            echo "No method changes this week."
            exit 0
          fi
          branch="method-update/$(date -u +%Y-%m-%d)-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add playbooks/
          git commit -m "Method update from this week's channel posts"
          git push origin "$branch"
          {
            echo "The methodology author's posts this week change the method for these tickers."
            echo "Merge to have next week's reports follow it; close to ignore."
            echo
            cat reports/method_changes.md
          } > method_pr.md
          if ! gh pr create --head "$branch" --title "Method update: $(date -u +%Y-%m-%d)" --body-file method_pr.md; then
            # Actions may not be allowed to open PRs in this repo; fall back to an issue
            gh issue create --title "Method update ready on branch $branch" --body-file method_pr.md
          fi

