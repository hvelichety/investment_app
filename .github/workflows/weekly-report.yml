name: Weekly Report

# Every Saturday: analyst memo, commentary and fact check for each ticker,
# opened as one issue per ticker for review. When the methodology author's
# new posts change the method, the revised playbooks open as a pull request.
# Nothing is posted to Slack; a person approves every draft and change.
on:
  schedule:
    # Saturdays 13:00 UTC, after Friday's close is in the price data
    - cron: '0 13 * * 6'
  workflow_dispatch:
    inputs:
      tickers:
        description: Space-separated tickers (blank = every ticker with a playbook)
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic pyyaml pandas yfinance

      - name: Check data and run tests
        run: python tests/test_analysis.py

      - name: Write reports
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}   # optional: enables the method review
          TICKERS: ${{ inputs.tickers }}
        run: python scripts/run_weekly.py $TICKERS

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-reports
          path: reports/
          if-no-files-found: ignore

      - name: Open review issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for body in reports/*_weekly.md; do
            ticker=$(basename "$body" _weekly.md)
            gh issue create \
              --title "Weekly report for review: $ticker ($(date -u +%Y-%m-%d))" \
              --body-file "$body"
          done

      - name: Propose method changes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- playbooks/; then
            echo "No method changes this week."
            exit 0
          fi
          branch="method-update/$(date -u +%Y-%m-%d)-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add playbooks/
          git commit -m "Method update from this week's channel posts"
          git push origin "$branch"
          {
            echo "The methodology author's posts this week change the method for these tickers."
            echo "Merge to have next week's reports follow it; close to ignore."
            echo
            cat reports/method_changes.md
          } > method_pr.md
          if ! gh pr create --head "$branch" --title "Method update: $(date -u +%Y-%m-%d)" --body-file method_pr.md; then
            # Actions may not be allowed to open PRs in this repo; fall back to an issue
            gh issue create --title "Method update ready on branch $branch" --body-file method_pr.md
          fi

