# Analyst playbook for RH.
#
# No sourced quarterly data file yet, so the weekly report is price-based:
# valuation band, relative performance, and the week's news.
# Framework follows the analysis in #stock-rh (docs/METHODOLOGY.md).

ticker: RH
slack_channel: C0A22TTJSN5   # #stock-rh
methodology_author: U09USSY3TNZ

method:
  valuation_band:
    basis: eps
    estimate: avg   # consensus average EPS × each multiple, as in the RH P/E range chart (2026-10-22)
    periods: ["0y", "+1y"]   # FY2026E (Jan 2027) and FY2027E (Jan 2028), shown with the current P/E on each (2026-10-22)
    multiple: {low: 20, high: 30}   # "projected 20x to 30x earnings multiple" (2026-08-08)
    zones: {low: 25, high: 75}
    horizon: 2026-12-31
  relative_performance:
    benchmarks: ["^GSPC", "^IXIC", "^RUT"]   # Russell 2000 added in the 2026-11-02 return chart
    since: 2026-10-07   # scaled into full allocation at ~117 (#stock-rh)

thesis_questions:
  - Is the price near the low or high end of the 20x to 30x band on analyst earnings, and has the band itself moved (estimate revisions)?
  - Are margins recovering from the tariff hit, or are projected earnings being impaired? The band only holds if earnings estimates hold.
  - Is RH outperforming the S&P 500 and Nasdaq since the Oct 7 entry, and is that RH-specific or market-wide?

kpis:
  - gross and operating margin (tariff impact)
  - analyst EPS estimate revisions (low / avg / high)
  - price 5 business days after each earnings report vs that year's band (history in the P/E range chart, 2026-10-22)
  - short interest as % of shares outstanding, and days to cover, at quarter end (charts 2026-11-01); also each FINRA mid-month and month-end count (2026-11-26 post)
  - insider buys and sells since the last earnings report (2026-11-26 post)
  - RSI (14-day) as a technical check after the fundamentals; below 30 is oversold (2026-11-22 chart, RSI 33.48 at the $107.94 Nov 20 close)

decisions:   # position actions taken under the band method, for context in later reports
  - 2026-10-07: scaled into full allocation at ~117, near the low end of the band
  - 2026-10-22: reduced risk by 50% at 138; letting the rest run toward 150 to 160 (FY2026E high end) by 12/31
  - 2026-10-31: watching closely at the high range of the band ($146.66 Oct 30 close, P/E 27.7x FY2026E)
  - 2026-11-02: called it a good exit near the Dec projection high range (~$153.62 intraday vs the $159 FY2026E 30x line)
  - 2026-11-19: another good entry point; re-entering on Nov 20 in the $110 range ($110.90 Nov 19 close, P/E 20.9x FY2026E, near the $106 20x line)
  - 2026-11-20: re-entered the trade at $109.35 (2026-11-21 post)
  - 2026-11-25: bouncing off the low band; +8.84% intraday to $112.60 on a down day for the market (2026-11-25 post)

leading_indicators:
  - Tariff policy changes lead margin changes.
  - Estimate revisions lead moves in the valuation band.

events_to_watch:
  - Quarterly earnings (post-earnings moves are tracked against the band); Q3 FY2026 expected around Dec 10 after the close, not yet confirmed by RH (2026-11-22 post, 2026-11-26 calendar). Pei expects upside into the report from current levels.
  - Section 232 tariff step-up on Jan 1, 2027: upholstered furniture 25% to 30%, kitchen cabinets and vanities 25% to 50%, unless agreements are reached sooner (2026-11-26 calendar; GHY, Jan 2, 2026).
  - Macro calendar in Pei's Nov 26 chart: FOMC Dec 8-9, Nov CPI Dec 10, peers Lovesac and Hooker report Dec 10, housing data (existing-home sales Dec 9, starts Dec 17, new-home sales Dec 23).
  - Tariff announcements affecting furniture imports.

style:
  audience: Experienced investors in the channel; write like a senior equity analyst reporting to a CFO.
  rules:
    - Lead with where the price sits in the band and what moved it.
    - Every number must appear in the fact pack or a cited news item; mark third-party estimates (‡).
    - Describe the band zone and what the channel's method does in that zone; no buy/sell calls of your own.
